<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#233f38" />
    <title>游览手记 · 江岸见</title>
    <link rel="manifest" href="app.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icon192.png" />
    <link rel="icon" href="assets/icon192.png" />
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="stylesheet" href="assets/navigator.css" />
    <link rel="stylesheet" href="assets/reception.css">
    <link rel="stylesheet" href="assets/porpoise.css">
  </head>
  <body data-page="place">
    <header>
      <a class="brand" href="index.html" data-nav="home" aria-label="江岸见 · 回到江豚接待台"><img src="assets/receptionist.webp" alt="" />江岸见<span class="homeLabel">接待台</span></a>
      <nav>
        <a href="index.html?view=route" data-nav="index"
          ><svg
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.65"
            stroke-linejoin="round"
          >
            <path d="m3 5 6-2 6 3 6-2v15l-6 2-6-3-6 2zM9 3v15m6-12v15" /></svg
          ><span>地图</span></a
        ><a href="trip.html" data-nav="trip"
          ><svg
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.65"
            stroke-linejoin="round"
          >
            <rect x="5" y="4" width="14" height="17" rx="2" />
            <path d="M9 4V2m6 2V2M8 10h8m-8 5h6" /></svg
          ><span>行程</span></a
        ><a href="cards.html" data-nav="cards" aria-current="page"
          ><svg
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.65"
            stroke-linejoin="round"
          >
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m3 16 5-5 5 5 3-3 5 4" />
            <circle cx="16" cy="9" r="1" /></svg
          ><span>明信片</span></a
        >
      <a href="reception.html" data-nav="reception"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4m0 1c4-4 10 4 15 0v10c-5 4-11-4-15 0"/></svg><span>赛事接待</span></a>
      </nav>
    </header>
    <main inert>
      <section class="journalWrap">
        <div class="jNav">
          <button id="backCard">← 明信片正面</button><button id="addVisit" class="jAdd"></button>
        </div>
        <article class="openBook">
          <aside class="jCover">
            <img id="jArt" alt="" />
            <div class="jCoverLabel">
              <span id="jArea"></span>
              <h1 id="landmark"></h1>
            </div>
          </aside>
          <section class="bookLeaf">
            <div class="jLine"><strong>游览手记</strong><span id="jStamp"></span></div>
            <h2 id="jTitle"></h2>
            <span id="jMinutes"></span>
            <div class="bookTabs" role="tablist" aria-label="手记栏目">
              <button role="tab" data-tab="walk" id="tabWalk" aria-controls="panelWalk">怎么玩</button
              ><button role="tab" id="tabPhoto" data-tab="photo" aria-controls="panelPhoto">取景</button
              ><button role="tab" data-tab="next" id="tabNext" aria-controls="panelNext">下一站</button
              ><button role="tab" data-tab="plan" id="tabPlan" aria-controls="panelPlan">出发前</button>
            </div>
            <div role="tabpanel" id="panelWalk" aria-labelledby="tabWalk" class="jPanel">
              <p id="firstLeg"></p>
              <p id="secondLeg"></p>
            </div>
            <div class="jPanel" id="panelPhoto" role="tabpanel" aria-labelledby="tabPhoto" hidden>
              <p id="photoFact"></p>
              <p id="photoStand"></p>
            </div>
            <div role="tabpanel" id="panelNext" aria-labelledby="tabNext" class="jPanel" hidden>
              <div id="nextVisits"></div>
            </div>
            <div role="tabpanel" id="panelPlan" aria-labelledby="tabPlan" class="jPanel" hidden>
              <p id="jTip"></p>
              <details>
                <summary>查阅资料</summary>
                <div id="jRefs"></div>
              </details>
            </div>
          </section>
        </article>
      </section>
    </main>
    <script src="assets/places.js"></script>
    <script src="assets/journal.js"></script>
    <script src="assets/albums.js"></script>
    <script src="assets/directions.js"></script>
    <script src="assets/reception.js"></script><script src="assets/porpoise.js"></script><script src="assets/app.js"></script>
  </body>
</html>
