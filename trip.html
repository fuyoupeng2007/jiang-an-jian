<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#233f38" />
    <title>我的行程 · 江岸见</title>
    <link rel="manifest" href="app.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icon192.png" />
    <link rel="icon" href="assets/icon192.png" />
    <link rel="stylesheet" href="assets/leaflet.css" />
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="stylesheet" href="assets/navigator.css" />
    <link rel="stylesheet" href="assets/reception.css">
    <link rel="stylesheet" href="assets/porpoise.css">
  </head>
  <body data-page="trip">
    <header>
      <a class="brand" href="index.html" data-nav="home" aria-label="江岸见 · 回到江豚接待台"><img src="assets/receptionist.webp" alt="" />江岸见<span class="homeLabel">接待台</span></a>
      <nav>
        <a href="index.html?view=route" data-nav="index"
          ><svg
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.65"
            stroke-linejoin="round"
          >
            <path d="m3 5 6-2 6 3 6-2v15l-6 2-6-3-6 2zM9 3v15m6-12v15" /></svg
          ><span>地图</span></a
        ><a href="trip.html" data-nav="trip" aria-current="page"
          ><svg
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.65"
            stroke-linejoin="round"
          >
            <rect x="5" y="4" width="14" height="17" rx="2" />
            <path d="M9 4V2m6 2V2M8 10h8m-8 5h6" /></svg
          ><span>行程</span></a
        ><a href="cards.html" data-nav="cards"
          ><svg
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.65"
            stroke-linejoin="round"
          >
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m3 16 5-5 5 5 3-3 5 4" />
            <circle cx="16" cy="9" r="1" /></svg
          ><span>明信片</span></a
        >
      <a href="reception.html" data-nav="reception"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4m0 1c4-4 10 4 15 0v10c-5 4-11-4-15 0"/></svg><span>赛事接待</span></a>
      </nav>
    </header>
    <main inert>
      <div class="tripWrap">
        <div class="tripHeading">
          <div>
            <h1>我的行程</h1>
            <p id="tripRoute"></p>
          </div>
          <button id="edit">编辑行程</button>
        </div>
        <div class="tripTop">
          <div><span>出发</span><b id="departDisplay"></b></div>
          <div class="barLine"></div>
          <div><span>预计到达</span><b id="arrival"></b></div>
        </div>
        <p id="tourFinish" hidden></p>
        <p id="slack"></p>
        <ol id="timeline"></ol>
        <details class="tripSources">
          <summary>出行估算与资料</summary>
          <p>
            时间按武汉当地时间显示。地面步行按约每分钟 75
            米估算，换乘计入站内步行和等候。过早排队、临时管制和班次调整需另留时间。
          </p>
          <a rel="noopener" target="_blank" href="https://www.amap.com/ssr/subway/wuhan-4201"
            >武汉地铁线网 ↗</a
          >
          ·
          <a rel="noopener" target="_blank" href="https://www.openstreetmap.org/copyright"
            >OpenStreetMap 路网 ↗</a
          >
        </details>
        <button class="primary" data-nav="index">回到地图　→</button>
      </div>
      <dialog id="editor">
        <form id="editForm">
          <div class="between">
            <h2>编辑行程</h2>
            <button type="button" id="cancel" aria-label="取消">×</button>
          </div>
          <div class="times">
            <label>出发时间<input type="time" id="startTime" required /></label
            ><label>最晚到达<input type="time" id="due" /></label>
          </div>
          <div class="goalTimes">
            <label><input type="checkbox" id="deadlineOn" />需要准时到达</label
            ><label id="dueDayWrap"
              ><select id="dueDay" aria-label="到达日期">
                <option value="0">当天</option>
                <option value="1">次日</option>
              </select></label
            ><label id="bufferWrap"
              >提前留出<select id="buffer" aria-label="提前入场时间">
                <option value="0">0 分钟</option>
                <option value="5">5 分钟</option>
                <option value="10">10 分钟</option>
                <option value="15">15 分钟</option>
                <option value="20">20 分钟</option>
                <option value="30">30 分钟</option>
                <option value="45">45 分钟</option>
              </select></label
            >
          </div>
          <div id="editRows"></div>
          <div class="extra">
            <select id="candidate" aria-label="添加地点"></select
            ><button id="insert" type="button">＋ 途经点</button>
          </div>
          <details>
            <summary>让接待员安排沿途停留</summary>
            <div class="extra">
              <select id="theme">
                <option value="architecture">地标建筑</option>
                <option value="food">老街小吃</option>
                <option value="water">江岸风光</option></select
              ><button type="button" id="recommend">按时间推荐</button>
            </div>
          </details>
          <p id="editStatus" role="status"></p>
          <button type="submit" class="primary">保存行程</button>
        </form>
      </dialog>
    </main>
    <script src="assets/places.js"></script>
    <script src="assets/leaflet.js"></script>
    <script src="assets/network.js"></script>
    <script src="assets/rail.js"></script>
    <script src="assets/travel.js"></script>
    <script src="assets/engine.js"></script>
    <script src="assets/journal.js"></script>
    <script src="assets/albums.js"></script>
    <script src="assets/directions.js"></script>
    <script src="assets/reception.js"></script><script src="assets/porpoise.js"></script><script src="assets/app.js"></script>
  </body>
</html>
