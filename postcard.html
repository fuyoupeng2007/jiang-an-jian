<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#233f38" />
    <title>动态明信片 · 江岸见</title>
    <link rel="manifest" href="app.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icon192.png" />
    <link rel="icon" href="assets/icon192.png" />
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="stylesheet" href="assets/navigator.css" />
    <link rel="stylesheet" href="assets/reception.css">
    <link rel="stylesheet" href="assets/porpoise.css">
  </head>
  <body data-page="postcard">
    <header>
      <a class="brand" href="index.html" data-nav="home" aria-label="江岸见 · 回到江豚接待台"><img src="assets/receptionist.webp" alt="" />江岸见<span class="homeLabel">接待台</span></a>
      <nav>
        <a href="index.html?view=route" data-nav="index"
          ><svg
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.65"
            stroke-linejoin="round"
          >
            <path d="m3 5 6-2 6 3 6-2v15l-6 2-6-3-6 2zM9 3v15m6-12v15" /></svg
          ><span>地图</span></a
        ><a href="trip.html" data-nav="trip"
          ><svg
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.65"
            stroke-linejoin="round"
          >
            <rect x="5" y="4" width="14" height="17" rx="2" />
            <path d="M9 4V2m6 2V2M8 10h8m-8 5h6" /></svg
          ><span>行程</span></a
        ><a href="cards.html" data-nav="cards" aria-current="page"
          ><svg
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.65"
            stroke-linejoin="round"
          >
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m3 16 5-5 5 5 3-3 5 4" />
            <circle cx="16" cy="9" r="1" /></svg
          ><span>明信片</span></a
        >
      <a href="reception.html" data-nav="reception"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4m0 1c4-4 10 4 15 0v10c-5 4-11-4-15 0"/></svg><span>赛事接待</span></a>
      </nav>
    </header>
    <main inert class="bookMain">
      <div class="bookBackdrop" aria-hidden="true"></div>
      <section class="bookShell">
        <div class="bookTop">
          <button data-nav="cards">← 资料册</button><span id="bookTitle"></span
          ><button id="returnMap" data-nav="index">回地图 ↗</button>
        </div>
        <div class="spread">
          <button class="leafArrow" id="prev" aria-label="上一张明信片">‹</button>
          <article id="paper" class="sheetPaper">
            <div class="sheetImage">
              <img id="bigArt" alt="" />
              <div class="printEdge"></div>
            </div>
            <div class="sheetCopy">
              <span id="district"></span>
              <h1 id="landmark"></h1>
              <p class="leafLead" id="sentence"></p>
              <p class="leafBody" id="leafBody"></p>
              <i class="smallSeal" aria-hidden="true">江岸<br />见</i>
            </div>
          </article>
          <button class="leafArrow" id="next" aria-label="下一张明信片">›</button>
        </div>
        <div class="filmStrip" id="filmStrip" aria-label="本册明信片"></div>
        <div class="bookFoot">
          <button id="leafModel">转动模型 ↗</button><button id="visit">游览手记 ↗</button><button id="addLeaf">＋ 加入途经</button
          ><button class="primary" id="setDest">去这里 →</button>
        </div>
        <p id="citySource" hidden>
          <a target="_blank" rel="noopener" href="https://dfz.wuhan.gov.cn/sqgk/whsq/"
            >城市资料 · 武汉市地方志工作办公室 ↗</a
          >
        </p>
      </section>
    </main>
    <script src="assets/places.js"></script>
    <script src="assets/journal.js"></script>
    <script src="assets/albums.js"></script>
    <script src="assets/directions.js"></script>
    <script src="assets/reception.js"></script><script src="assets/porpoise.js"></script><script src="assets/app.js"></script>
  </body>
</html>
