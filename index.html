<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#233f38" />
    <title>武汉地图 · 江岸见</title>
    <link rel="manifest" href="app.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icon192.png" />
    <link rel="icon" href="assets/icon192.png" />
    <link rel="stylesheet" href="assets/leaflet.css" />
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="stylesheet" href="assets/navigator.css" />
    <link rel="stylesheet" href="assets/reception.css">
    <link rel="stylesheet" href="assets/porpoise.css">
  </head>
  <body data-page="index">
    <header>
      <a class="brand" href="index.html" data-nav="home" aria-label="江岸见 · 回到江豚接待台"><img src="assets/receptionist.webp" alt="" />江岸见<span class="homeLabel">接待台</span></a>
      <nav>
        <a href="index.html?view=route" data-nav="index" aria-current="page"
          ><svg
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.65"
            stroke-linejoin="round"
          >
            <path d="m3 5 6-2 6 3 6-2v15l-6 2-6-3-6 2zM9 3v15m6-12v15" /></svg
          ><span>地图</span></a
        ><a href="trip.html" data-nav="trip"
          ><svg
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.65"
            stroke-linejoin="round"
          >
            <rect x="5" y="4" width="14" height="17" rx="2" />
            <path d="M9 4V2m6 2V2M8 10h8m-8 5h6" /></svg
          ><span>行程</span></a
        ><a href="cards.html" data-nav="cards"
          ><svg
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.65"
            stroke-linejoin="round"
          >
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m3 16 5-5 5 5 3-3 5 4" />
            <circle cx="16" cy="9" r="1" /></svg
          ><span>明信片</span></a
        >
      <a href="reception.html" data-nav="reception"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4m0 1c4-4 10 4 15 0v10c-5 4-11-4-15 0"/></svg><span>赛事接待</span></a>
      </nav>
    </header>
    <main inert class="navMain">
      <div class="mapLayout">
        <aside class="planner">
          <div class="plannerInner">
            <div class="planHead">
              <h1>武汉漫游</h1>
              <button id="swap" aria-label="交换起终点" title="交换起终点">⇅</button>
            </div>
            <div class="stopsPair">
              <label
                ><i class="startDot"></i><span>从</span
                ><select id="origin" aria-label="起点"></select></label
              ><label
                ><i class="endDot"></i><span>到</span
                ><select id="dest" aria-label="终点"></select
              ></label>
            </div>
            <div class="modes" aria-label="出行方式">
              <button data-mode="transit">地铁优先</button><button data-mode="walk">步行</button
              ><button data-mode="ferry">步行＋轮渡</button>
            </div>
            <div class="routeStats" id="summary" aria-live="polite">正在读武汉路网…</div>
            <div class="planActions">
              <button class="primary" id="startNav">开始导览</button><button id="openTrip">行程明细</button>
            </div>
            <div class="viaChips" id="viaChips"></div>
            <p id="notice" role="status"></p>
          </div>
          <section class="along">
            <div class="alongTitle">
              <h2>沿途逛逛</h2>
              <div><button id="planTour">帮我排路线</button><button id="demo">示例 ↗</button></div>
            </div>
            <div class="interests">
              <button data-interest="any">顺路</button><button data-interest="photo">拍照</button
              ><button data-interest="food">小吃</button><button data-interest="water">看水景</button>
            </div>
            <div id="suggestions"></div>
          </section>
        </aside>
        <section class="mapShell">
          <div id="map" aria-label="武汉互动地图"></div>
          <div class="placeFinder">
            <input
              id="findPlace"
              type="search"
              placeholder="搜地点、美食或拍照点"
              aria-label="搜索地点"
              autocomplete="off"
            />
            <div id="matches" hidden></div>
          </div>
          <div class="mapTools">
            <button data-nav="city">建设我的武汉</button><button id="showVenues" title="定位两个蓝色赛事场地">赛事场地</button><button id="city" title="全城视野">全城</button><button id="fit" title="查看完整路线">路线</button
            ><button id="gps" title="获取设备定位">定位</button>
          </div>
          <button class="birdCall" id="askBird"><img src="assets/receptionist.webp" alt="" />问接待员</button>
          <div class="playBar"><button id="play">预演路线</button></div>
          <section id="followBox" hidden>
            <div class="followHead">
              <small id="followKind"></small><button id="endFollow">退出跟走</button>
            </div>
            <b id="followName"></b>
            <p id="followDetail"></p>
            <small id="followPosition"></small><button id="arrivalBook" hidden>翻到站明信片 ↗</button>
            <div class="followActions">
              <button id="followHost">问小江豚</button><button id="mapGps">定位跟随</button><button id="mapDetails">整段指引</button
              ><button class="primary" id="mapNext">下一步</button>
            </div>
          </section>
          <div id="nearbyStop" hidden>
            <button id="nearRead">
              <img id="nearThumb" alt="" /><span
                ><small id="nearRange"></small><b id="nearName"></b
              ></span></button
            ><button id="nearAdd" aria-label="把沿途发现加入途经点">＋</button>
          </div>
          <div class="pick" id="pick" hidden>
            <div class="pickHead">
              <img id="pickArt" alt="" />
              <div><small id="pickType"></small><strong id="pickName"></strong></div>
              <button id="dismiss" aria-label="关闭地点选项">×</button>
            </div>
            <div class="pickButtons">
              <button data-set="start">从这出发</button><button data-set="via">＋ 途经</button
              ><button data-set="end">去这里</button><button id="pickHost">听小江豚讲</button><button id="openCard">转动模型 ↗</button><button id="pickPostcard">翻明信片</button>
            </div>
          </div>
        </section>
      </div>
      <dialog id="directionPanel" class="guideSheet">
        <header class="sheetHead">
          <div>
            <small>江岸见 · 步行与换乘</small>
            <h2>沿途指引</h2>
          </div>
          <button data-close="directionPanel" aria-label="关闭指引">×</button>
        </header>
        <div class="legPick">
          <select id="legChoice" aria-label="选择导览路段"></select
          ><button id="guideHost">问小江豚</button><button id="followMap">地图跟走 ↗</button>
        </div>
        <div id="guideContents"></div>
        <div class="sheetFoot">
          <button id="watchGps">跟随我的位置</button><button class="primary" id="nextStep">下一步 →</button>
        </div>
        <p id="gpsStatus" role="status"></p>
        <button id="replanFix" hidden>从当前位置重算</button>
      </dialog>
      <dialog class="guideSheet tourDialog" id="tourPanel">
        <header class="sheetHead">
          <div>
            <small>接待员 · 沿途安排</small>
            <h2>这一路想怎么逛？</h2>
          </div>
          <button id="tourDismiss" aria-label="关闭路线建议">×</button>
        </header>
        <p id="tourAnchors"></p>
        <form id="tourForm">
          <div class="tourInputs">
            <label
              >额外可用时间<input
                id="tourBudget"
                type="number"
                inputmode="numeric"
                min="0"
                max="450"
                value="65"
              />
              分钟</label
            ><label
              >最多加<select id="tourStops">
                <option value="1">1 站</option>
                <option value="2">2 站</option>
                <option value="3">3 站</option>
              </select></label
            >
          </div>
          <div class="tourTopics">
            <label><input type="checkbox" name="tourTopic" value="photo" />拍照</label
            ><label><input type="checkbox" name="tourTopic" value="food" />小吃</label
            ><label><input type="checkbox" name="tourTopic" value="water" />水景</label
            ><label><input type="checkbox" id="tourQuiet" />慢慢逛</label>
          </div>
        </form>
        <p id="tourStatus" role="status"></p>
        <div id="tourResults"></div>
      </dialog>
    </main>
    <script src="assets/places.js"></script>
    <script src="assets/leaflet.js"></script>
    <script src="assets/search-data.js"></script>
    <script src="assets/network.js"></script>
    <script src="assets/rail.js"></script>
    <script src="assets/travel.js"></script>
    <script src="assets/engine.js"></script>
    <script src="assets/journal.js"></script>
    <script src="assets/albums.js"></script>
    <script src="assets/directions.js"></script>
    <script src="assets/reception.js"></script>
    <script src="assets/porpoise.js"></script><script src="assets/app.js"></script>
  </body>
</html>
